<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folha de Ponto – Estagiários</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --tx: #1c2630; --mut: #66727f; --bd: #dfe3e8;
      --ac: #2563eb; --bad: #c62828; --ok: #2e7d32; --warn: #b26a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #13171c; --card: #1d232a; --tx: #e8ecf0; --mut: #9aa6b2; --bd: #2f3740;
        --ac: #6ea0ff; --bad: #ff7b7b; --ok: #76d17b; --warn: #f0b04a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 0; }
    .sub { color: var(--mut); margin: 2px 0 14px; font-size: 13px; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    label { display: flex; flex-direction: column; font-size: 12px; color: var(--mut); gap: 3px; }
    input { font: inherit; color: var(--tx); background: var(--bg); border: 1px solid var(--bd); border-radius: 8px; padding: 7px 9px; min-width: 0; }
    button { font: inherit; border: 0; border-radius: 8px; padding: 9px 15px; background: var(--ac); color: #fff; cursor: pointer; }
    button.s { background: var(--bg); color: var(--tx); border: 1px solid var(--bd); }
    button:disabled { opacity: .5; cursor: default; }
    .wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { padding: 7px 8px; border-bottom: 1px solid var(--bd); text-align: left; white-space: nowrap; }
    th { font-size: 12px; color: var(--mut); font-weight: 600; }
    .late, .bad { color: var(--bad); font-weight: 600; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .kpi { background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 10px 12px; }
    .kpi b { display: block; font-size: 22px; }
    .kpi span { font-size: 12px; color: var(--mut); }
    .chip { padding: 2px 8px; border-radius: 99px; font-size: 12px; border: 1px solid currentColor; }
    .note { font-size: 12px; color: var(--mut); }
    .msg { margin: 10px 0 0; font-weight: 600; }
    details summary { cursor: pointer; }
    #login { max-width: 380px; margin: 40px auto; }
  </style>
</head>
<body>
<main>
  <div id="login" class="card">
    <h1>Folha de Ponto</h1>
    <p class="sub">Entre com seu nome completo e sua senha.</p>
    <div class="row" style="flex-direction:column;align-items:stretch">
      <label>Nome completo<input id="ln" autocomplete="name" placeholder="Ex: Layssa"></label>
      <label>Senha<input id="ls" type="password" autocomplete="current-password" placeholder="123"></label>
      <button id="lb">Entrar</button>
    </div>
    <p id="lm" class="msg bad"></p>
    <p class="note" style="margin-top:12px">Supervisor(a): <b>Layssa</b> / Senha: <b>123</b><br>Estagiários: Lucas, Maria Js, Caua, Felipe, Isa, Ana, Jullya, Yaskara, Caio (Treinamento), Pina, Camilli, Juan, Enzo / Senha: <b>123</b></p>
  </div>

  <div id="app" style="display:none">
    <div class="top">
      <div>
        <h1 id="who"></h1>
        <p class="sub" id="role"></p>
      </div>
      <button class="s" id="out">Sair</button>
    </div>
    <div id="body"></div>
  </div>

  <script>
    const users = [
      { nome: "Lucas", senha: "123", role: "estagiario" },
      { nome: "Maria Js", senha: "123", role: "estagiario" },
      { nome: "Caua", senha: "123", role: "estagiario" },
      { nome: "Felipe", senha: "123", role: "estagiario" },
      { nome: "Isa", senha: "123", role: "estagiario" },
      { nome: "Ana", senha: "123", role: "estagiario" },
      { nome: "Jullya", senha: "123", role: "estagiario" },
      { nome: "Yaskara", senha: "123", role: "estagiario" },
      { nome: "Caio (Treinamento)", senha: "123", role: "estagiario" },
      { nome: "Pina", senha: "123", role: "estagiario" },
      { nome: "Camilli", senha: "123", role: "estagiario" },
      { nome: "Juan", senha: "123", role: "estagiario" },
      { nome: "Enzo", senha: "123", role: "estagiario" },
      { nome: "Layssa", senha: "123", role: "supervisor" }
    ];

    let cfg = JSON.parse(localStorage.getItem('ponto_cfg') || JSON.stringify({ entrada: '08:00', tol: 10, limite: 60 }));
    let recs = JSON.parse(localStorage.getItem('ponto_recs') || '[]');

    const \$ = s => document.querySelector(s), pad = n => String(n).padStart(2, '0');
    const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const mins = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
    const hm = m => m == null ? '—' : Math.floor(m / 60) + 'h' + pad(m % 60);
    const tm = m => m == null ? '—' : pad(Math.floor(m / 60)) + ':' + pad(m % 60);
    const br = d => d.split('-').reverse().join('/');
    const now = new Date();
    let from = iso(new Date(now.getFullYear(), now.getMonth(), 1));
    let to = iso(new Date(now.getFullYear(), now.getMonth() + 1, 0));
    let S = { nome: '', senha: '', role: '' }, msg = '';

    function saveDB() {
      localStorage.setItem('ponto_recs', JSON.stringify(recs));
      localStorage.setItem('ponto_cfg', JSON.stringify(cfg));
    }

    function dayMap(list) {
      const m = {};
      list.forEach(r => {
        const k = r.nome + '|' + r.data;
        const d = m[k] = m[k] || { nome: r.nome, data: r.data, ent: null, sai: null };
        const t = mins(r.hora);
        if (r.tipo === 'Entrada') {
          if (d.ent == null || t < d.ent) d.ent = t;
        } else {
          if (d.sai == null || t > d.sai) d.sai = t;
        }
      });
      Object.values(m).forEach(d => {
        const a = d.ent == null ? 0 : d.ent - mins(cfg.entrada);
        d.atraso = a > cfg.tol ? a : 0;
        d.trab = d.ent != null && d.sai != null && d.sai >= d.ent ? d.sai - d.ent : null;
      });
      return m;
    }

    function weekdays() {
      const a = [], d = new Date(from + 'T12:00'), f = new Date(to + 'T12:00');
      while (d <= f && a.length < 93) {
        if (d.getDay() % 6) a.push(iso(d));
        d.setDate(d.getDate() + 1);
      }
      return a;
    }

    const periodBar = () => `<label>De<input type="date" id="pf" value="${from}"></label><label>Até<input type="date" id="pt" value="${to}"></label>`;
    
    function bindPeriod() {
      \$('#pf').onchange = e => { from = e.target.value || from; load(); };
      \$('#pt').onchange = e => { to = e.target.value || to; load(); };
    }

    function load() {
      S.role === 'supervisor' ? viewSup() : viewMine();
    }

    function viewMine() {
      const dm = dayMap(recs), ds = weekdays();
      let tA = 0, nA = 0, tT = 0;
      const rows = ds.map(d => {
        const x = dm[S.nome + '|' + d] || {};
        if (x.atraso) { tA += x.atraso; nA++; }
        tT += x.trab || 0;
        return `<tr>
          <td>${br(d)}</td>
          <td>${tm(x.ent)}</td>
          <td>${tm(x.sai)}</td>
          <td class="${x.atraso ? 'late' : ''}">${x.ent == null ? '—' : x.atraso ? x.atraso + ' min' : 'no horário'}</td>
          <td>${hm(x.trab)}</td>
        </tr>`;
      }).join('');

      \$('#body').innerHTML = `
        <div class="card">
          <div class="row">
            <button id="bi">Registrar entrada</button>
            <button class="s" id="bo">Registrar saída</button>
          </div>
          <p class="msg" id="pm">${esc(msg)}</p>
          <p class="note">O horário registrado é o do dispositivo e atualizado na hora.</p>
        </div>
        <div class="card"><div class="row">${periodBar()}</div></div>
        <div class="kpis">
          <div class="kpi"><b>${hm(tA)}</b><span>Atraso total no período</span></div>
          <div class="kpi"><b>${nA}</b><span>Dias com atraso</span></div>
          <div class="kpi"><b>${hm(tT)}</b><span>Horas trabalhadas</span></div>
        </div>
        <div class="card wrap">
          <table>
            <tr><th>Data</th><th>Entrada</th><th>Saída</th><th>Atraso</th><th>Horas</th></tr>
            ${rows || '<tr><td colspan=5>Sem dias úteis no período.</td></tr>'}
          </table>
        </div>`;
      
      bindPeriod();
      const punch = tipo => {
        const nowD = new Date();
        const dateStr = iso(nowD);
        const timeStr = pad(nowD.getHours()) + ':' + pad(nowD.getMinutes());
        recs.push({ data: dateStr, hora: timeStr, nome: S.nome, tipo: tipo });
        saveDB();
        msg = `${tipo} registrada às ${timeStr}.`;
        load();
      };
      \$('#bi').onclick = () => punch('Entrada');
      \$('#bo').onclick = () => punch('Saída');
    }

    function viewSup() {
      const dm = dayMap(recs), interns = users.filter(u => u.role === 'estagiario').map(u => u.nome);
      const g = {};
      interns.forEach(n => g[n] = { nome: n, dias: 0, nA: 0, tA: 0, tT: 0, sem: 0, lista: [] });
      
      Object.values(dm).forEach(d => {
        const s = g[d.nome] = g[d.nome] || { nome: d.nome, dias: 0, nA: 0, tA: 0, tT: 0, sem: 0, lista: [] };
        if (d.ent == null) return;
        s.dias++; s.tT += d.trab || 0;
        if (d.trab == null) s.sem++;
        if (d.atraso) {
          s.nA++; s.tA += d.atraso;
          s.lista.push(br(d.data) + ' – ' + tm(d.ent) + ' (' + d.atraso + ' min)');
        }
      });

      const L = Object.values(g).sort((a, b) => b.tA - a.tA);
      const tot = L.reduce((a, s) => a + s.tA, 0);

      const body = L.map(s => {
        const st = s.tA > cfg.limite ? ['Crítico', 'bad'] : s.tA > 0 ? ['Atenção', 'warn'] : ['Em dia', 'ok'];
        return `<tr>
          <td>
            <details>
              <summary>${esc(s.nome)}</summary>
              <div class="note">${s.lista.length ? s.lista.map(esc).join('<br>') : 'Nenhum atraso.'}</div>
            </details>
          </td>
          <td>${s.dias}</td>
          <td>${s.nA}</td>
          <td class="${s.tA ? 'late' : ''}">${hm(s.tA)}</td>
          <td>${hm(s.tT)}</td>
          <td>${s.sem || '—'}</td>
          <td><span class="chip ${st[1]}">${st[0]}</span></td>
        </tr>`;
      }).join('');

      \$('#body').innerHTML = `
        <div class="card">
          <b>Regras</b>
          <div class="row" style="margin-top:8px">
            <label>Horário de entrada<input type="time" id="c1" value="${esc(cfg.entrada)}"></label>
            <label>Tolerância (min)<input type="number" id="c2" min="0" value="${cfg.tol}" style="width:90px"></label>
            <label>Limite de atraso no período (min)<input type="number" id="c4" min="0" value="${cfg.limite}" style="width:110px"></label>
            <button id="cs">Salvar regras</button>
          </div>
          <p class="note">Se a chegada passar da tolerância, conta o atraso inteiro; dentro dela, não conta.</p>
        </div>
        <div class="card"><div class="row">${periodBar()}<button class="s" id="ex">Exportar CSV</button><button class="s" id="rf">Atualizar</button></div></div>
        <div class="kpis">
          <div class="kpi"><b>${L.length}</b><span>Estagiários</span></div>
          <div class="kpi"><b>${L.filter(s => s.tA > 0).length}</b><span>Com atraso</span></div>
          <div class="kpi"><b>${hm(tot)}</b><span>Atraso somado</span></div>
        </div>
        <div class="card wrap">
          <table>
            <tr><th>Estagiário</th><th>Dias</th><th>Dias c/ atraso</th><th>Atraso total</th><th>Horas</th><th>Sem saída</th><th>Status</th></tr>
            ${body || '<tr><td colspan=7>Nenhum estagiário cadastrado.</td></tr>'}
          </table>
        </div>`;

      bindPeriod();
      \$('#rf').onclick = load;
      \$('#cs').onclick = () => {
        cfg.entrada = \$('#c1').value || '08:00';
        cfg.tol = Number(\$('#c2').value || 0);
        cfg.limite = Number(\$('#c4').value || 0);
        saveDB();
        load();
        alert('Regras salvas com sucesso!');
      };
      \$('#ex').onclick = () => {
        const csv = '\ufeff' + ['Estagiario;Dias;Dias com atraso;Atraso (min);Horas trabalhadas (min);Sem saida', ...L.map(s => [s.nome, s.dias, s.nA, s.tA, s.tT, s.sem].join(';'))].join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        a.download = 'monitoria_' + from + '_' + to + '.csv';
        a.click();
      };
    }

    function entrar(nome, senha) {
      $('#lb').disabled = true; $('#lm').textContent = '';
      const u = users.find(x => x.nome.trim().toLowerCase() === String(nome || '').trim().toLowerCase() && x.senha === String(senha || '').trim());
      \$('#lb').disabled = false;
      if (!u) {
        \$('#lm').textContent = 'Utilizador ou senha incorretos.';
        try { sessionStorage.removeItem('s'); } catch (e) {}
        return;
      }
      S = { nome: u.nome, senha: u.senha, role: u.role };
      try { sessionStorage.setItem('s', JSON.stringify({ nome: u.nome, senha: u.senha })); } catch (e) {}
      $('#login').style.display = 'none'; $('#app').style.display = '';
      \$('#who').textContent = u.nome;
      \$('#role').textContent = u.role === 'supervisor' ? 'Tela de monitoria' : 'Meu ponto';
      msg = '';
      load();
    }

    \$('#lb').onclick = () => entrar($('#ln').value, $('#ls').value);
    $('#ls').onkeydown = e => { if (e.key === 'Enter') $('#lb').click(); };
    \$('#out').onclick = () => { try { sessionStorage.removeItem('s'); } catch (e) {} location.reload(); };
    try {
      const s = JSON.parse(sessionStorage.getItem('s') || 'null');
      if (s) entrar(s.nome, s.senha);
    } catch (e) {}
  </script>
</main>
</body>
</html>

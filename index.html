
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folha de Ponto – Estagiários</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1c2630;--mut:#66727f;--bd:#dfe3e8;--ac:#2563eb;--bad:#c62828;--ok:#2e7d32;--warn:#b26a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,sans-serif}
main{max-width:1100px;margin:auto;padding:16px}
h1{font-size:21px;margin:0}
h2{font-size:17px}
.sub{color:var(--mut);margin:3px 0 14px;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px;width:100%}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%;margin-top:3px}
button{font:inherit;border:0;border-radius:8px;padding:10px 15px;background:var(--ac);color:white;cursor:pointer;font-weight:600;margin-top:8px}
button:disabled{opacity:.55;cursor:wait}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mut)}
.late,.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok)}.warn{color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px}.kpi span,.note{font-size:12px;color:var(--mut)}
.msg{margin:10px 0 0;font-weight:600;overflow-wrap:anywhere}
#login{max-width:390px;margin:40px auto}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{margin-top:0}
.chip{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
</style>
</head>
<body>
<main>
  <section id="login" class="card">
    <h1>Folha de Ponto</h1>
    <p class="sub">Entre com seu nome e sua senha.</p>
    <label>Nome
      <input id="ln" autocomplete="username" placeholder="Digite seu nome">
    </label>
    <label style="margin-top:10px">Senha
      <input id="ls" type="password" autocomplete="current-password" placeholder="123">
    </label>
    <button id="lb" style="width:100%">Entrar</button>
    <p id="lm" class="msg bad"></p>
    <p class="note">Supervisoras: Layssa e Damiana. Senha de acesso: 123.</p>
  </section>

  <section id="app" style="display:none">
    <div class="top">
      <div>
        <h1 id="who"></h1>
        <p id="role" class="sub"></p>
      </div>
      <button class="s" onclick="sair()">Sair</button>
    </div>
    <p id="status" class="msg"></p>
    <div id="body"></div>
  </section>
</main>

<script>
"use strict";

const SUPABASE_URL = "https://nrcpqtrmfxxnemgnfzqz.supabase.co";
const SUPABASE_KEY = "sb_publishable_6uKw8SGTytkd4w9Q6Cnvc_g_KF8tAymw";
const LOGIN_URL = SUPABASE_URL + "/functions/v1/login-estagiarios";
const PONTOS_URL = SUPABASE_URL + "/functions/v1/pontos-estagiarios";

const NOMES_ESTAGIARIOS = [
  "Lucas", "Maria Js", "Caua", "Felipe", "Isa", "Ana",
  "Jullya", "Yaskara", "Caio (Treinamento)", "Pina",
  "Camilli", "Juan", "Enzo"
];

const INICIO_APURACAO = "2026-10-20";
const CFG = { entrada: "08:00", tolerancia: 10, limite: 60 };

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
}[c]));
const mins = t => {
  if (!t) return null;
  const [h,m] = String(t).slice(0,5).split(":").map(Number);
  return h*60+m;
};
const tm = m => m == null ? "—" : pad(Math.floor(m/60))+":"+pad(m%60);
const hm = m => m == null ? "—" : Math.floor(m/60)+"h"+pad(m%60);
const br = d => String(d).slice(0,10).split("-").reverse().join("/");

let S = null;
let senhaAtual = "";
let recs = [];
let msg = "";

async function chamar(url, payload) {
  const resp = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY
    },
    body: JSON.stringify(payload)
  });

  let json;
  try { json = await resp.json(); }
  catch { throw new Error("O servidor retornou uma resposta inválida."); }

  const dados = json.dados || json.data || json;

  if (!resp.ok || dados.sucesso === false || json.sucesso === false) {
    throw new Error(dados.erro || json.erro || json.message || "Não foi possível completar a operação.");
  }
  return dados;
}

async function fazerLogin() {
  const nome = $("#ln").value.trim();
  const senha = $("#ls").value.trim();
  $("#lm").textContent = "";

  if (!nome || !senha) {
    $("#lm").textContent = "Digite seu nome e sua senha.";
    return;
  }

  $("#lb").disabled = true;
  $("#lb").textContent = "Entrando...";

  try {
    const resposta = await chamar(LOGIN_URL, { nome, senha });
    const funcionario = resposta.funcionario || resposta.dados?.funcionario;

    if (!funcionario || !funcionario.nome || !funcionario.perfil) {
      throw new Error("Resposta do login incompleta. Confira a função login-estagiarios.");
    }

    S = {
      nome: funcionario.nome,
      role: funcionario.perfil
    };
    senhaAtual = senha;

    $("#login").style.display = "none";
    $("#app").style.display = "";
    $("#who").textContent = S.nome;
    $("#role").textContent = S.role === "supervisor"
      ? "Painel das Supervisoras"
      : "Meu Ponto";

    await atualizarPontos();
  } catch (e) {
    $("#lm").textContent = e.message || "Falha no login.";
  } finally {
    $("#lb").disabled = false;
    $("#lb").textContent = "Entrar";
  }
}

$("#lb").addEventListener("click", fazerLogin);
$("#ls").addEventListener("keydown", e => {
  if (e.key === "Enter") fazerLogin();
});

function sair() {
  S = null;
  senhaAtual = "";
  recs = [];
  $("#ls").value = "";
  $("#login").style.display = "";
  $("#app").style.display = "none";
  $("#lm").textContent = "";
  $("#status").textContent = "";
  $("#body").innerHTML = "";
}

function periodoAtual() {
  const hoje = new Date();
  const dia = hoje.getDate();
  let ano = hoje.getFullYear();
  let mes = hoje.getMonth();

  if (dia < 20) mes--;
  const inicio = new Date(ano, mes, 20, 12);
  const fim = new Date(ano, mes + 1, 19, 12);

  return { inicio: iso(inicio), fim: iso(fim) };
}

function noPeriodo(data) {
  const p = periodoAtual();
  return data >= p.inicio && data <= p.fim && data >= INICIO_APURACAO;
}

async function atualizarPontos() {
  if (!S) return;
  $("#status").textContent = "Carregando registros da nuvem...";

  try {
    const resposta = await chamar(PONTOS_URL, {
      action: "listar",
      nome: S.nome,
      senha: senhaAtual
    });
    recs = Array.isArray(resposta.pontos) ? resposta.pontos : [];
    $("#status").textContent = "Registros sincronizados com o Supabase.";
    load();
  } catch (e) {
    $("#status").textContent = "Erro ao carregar: " + (e.message || "tente novamente.");
  }
}

function dayMap(list) {
  const m = {};
  list.filter(r => noPeriodo(String(r.data).slice(0,10))).forEach(r => {
    const data = String(r.data).slice(0,10);
    const chave = r.nome + "|" + data;
    const d = m[chave] = m[chave] || {
      nome: r.nome, data, ent: null, sai: null
    };
    const t = mins(r.hora);
    if (r.tipo === "Entrada") {
      if (d.ent == null || t < d.ent) d.ent = t;
    } else if (r.tipo === "Saída") {
      if (d.sai == null || t > d.sai) d.sai = t;
    }
  });

  Object.values(m).forEach(d => {
    const atraso = d.ent == null ? 0 : d.ent - mins(CFG.entrada);
    d.atraso = atraso > CFG.tolerancia ? atraso : 0;
    d.trab = d.ent != null && d.sai != null && d.sai >= d.ent
      ? d.sai - d.ent : null;
  });
  return m;
}

function diasUteisPeriodo() {
  const p = periodoAtual();
  const inicio = new Date(Math.max(
    new Date(p.inicio + "T12:00:00").getTime(),
    new Date(INICIO_APURACAO + "T12:00:00").getTime()
  ));
  const fim = new Date(p.fim + "T12:00:00");
  const dias = [];

  for (let d = inicio; d <= fim; d.setDate(d.getDate()+1)) {
    if (d.getDay() !== 0 && d.getDay() !== 6) dias.push(iso(d));
  }
  return dias;
}

function load() {
  if (!S) return;
  if (S.role === "supervisor") viewSup();
  else viewMine();
}

function viewMine() {
  const meus = recs.filter(r => r.nome === S.nome);
  const dm = dayMap(meus);
  const dias = diasUteisPeriodo();
  let atrasoTotal = 0, diasAtraso = 0, horas = 0;

  const rows = dias.map(data => {
    const x = dm[S.nome + "|" + data] || {};
    if (x.atraso) { atrasoTotal += x.atraso; diasAtraso++; }
    horas += x.trab || 0;

    return `<tr>
      <td>${br(data)}</td>
      <td>${tm(x.ent)}</td>
      <td>${tm(x.sai)}</td>
      <td class="${x.atraso ? "late" : ""}">${
        x.ent == null ? "—" : x.atraso ? x.atraso + " min" : "No horário"
      }</td>
      <td>${hm(x.trab)}</td>
    </tr>`;
  }).join("");

  $("#body").innerHTML = `
    <div class="card">
      <h2>Registrar ponto</h2>
      <p class="note">Período: ${br(periodoAtual().inicio)} a ${br(periodoAtual().fim)}. Apuração a partir de 20/10/2026.</p>
      <div class="actions">
        <button id="entradaBtn" onclick="registraPonto('Entrada')">Registrar entrada</button>
        <button id="saidaBtn" class="s" onclick="registraPonto('Saída')">Registrar saída</button>
        <button class="s" onclick="atualizarPontos()">Atualizar registros</button>
      </div>
      <p id="msg" class="msg">${esc(msg)}</p>
    </div>
    <div class="kpis">
      <div class="kpi"><b>${hm(atrasoTotal)}</b><span>Atraso total</span></div>
      <div class="kpi"><b>${diasAtraso}</b><span>Dias com atraso</span></div>
      <div class="kpi"><b>${hm(horas)}</b><span>Horas trabalhadas</span></div>
    </div>
    <div class="card wrap">
      <h2>Meu espelho de ponto</h2>
      <table>
        <thead><tr><th>Data</th><th>Entrada</th><th>Saída</th><th>Atraso</th><th>Horas</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5">Nenhum dia no período.</td></tr>'}</tbody>
      </table>
    </div>`;
}

async function registraPonto(tipo) {
  if (!S) return;
  if (tipo !== "Entrada" && tipo !== "Saída") return;

  const botao = tipo === "Entrada" ? $("#entradaBtn") : $("#saidaBtn");
  if (botao) botao.disabled = true;

  try {
    const agora = new Date();
    const data = iso(agora);
    const hora = pad(agora.getHours()) + ":" + pad(agora.getMinutes()) + ":00";

    if (data < INICIO_APURACAO) {
      throw new Error("A apuração começa em 20/10/2026. O registro não foi enviado.");
    }

    const resposta = await chamar(PONTOS_URL, {
      action: "registrar",
      nome: S.nome,
      senha: senhaAtual,
      tipo,
      data,
      hora
    });

    msg = tipo + " registrada às " + hora.slice(0,5) + ".";
    await atualizarPontos();
  } catch (e) {
    msg = "Não foi possível registrar: " + (e.message || "tente novamente.");
    const el = $("#msg");
    if (el) el.textContent = msg;
  } finally {
    if (botao) botao.disabled = false;
  }
}

function viewSup() {
  const dm = dayMap(recs);
  const lista = NOMES_ESTAGIARIOS.map(nome => ({
    nome, dias: 0, nA: 0, tA: 0, tT: 0, sem: 0, faltas: 0
  }));
  const porNome = Object.fromEntries(lista.map(x => [x.nome, x]));

  Object.values(dm).forEach(d => {
    if (!porNome[d.nome]) return;
    const s = porNome[d.nome];
    if (d.ent == null) return;
    s.dias++;
    s.tT += d.trab || 0;
    if (d.sai == null) s.sem++;
    if (d.atraso) { s.nA++; s.tA += d.atraso; }
  });

  const totalAtraso = lista.reduce((n, x) => n + x.tA, 0);
  const totalComAtraso = lista.filter(x => x.tA > 0).length;
  const body = lista.map(s => {
    const st = s.tA > CFG.limite
      ? ["Crítico", "bad"]
      : s.tA > 0 ? ["Atenção", "warn"] : ["Em dia", "ok"];

    return `<tr>
      <td>${esc(s.nome)}</td>
      <td>${s.dias}</td>
      <td>${s.nA}</td>
      <td class="${s.tA ? "late" : ""}">${hm(s.tA)}</td>
      <td>${hm(s.tT)}</td>
      <td>${s.sem || "—"}</td>
      <td><span class="chip ${st[1]}">${st[0]}</span></td>
    </tr>`;
  }).join("");

  $("#body").innerHTML = `
    <div class="card">
      <h2>Painel das Supervisoras</h2>
      <p class="note">Período de apuração: ${br(periodoAtual().inicio)} a ${br(periodoAtual().fim)}. Os dados vêm do Supabase.</p>
      <div class="actions">
        <button onclick="atualizarPontos()">Atualizar registros</button>
        <button class="s" onclick="exportarCSV()">Exportar CSV para Excel</button>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><b>${lista.length}</b><span>Estagiários</span></div>
      <div class="kpi"><b>${totalComAtraso}</b><span>Com atraso</span></div>
      <div class="kpi"><b>${hm(totalAtraso)}</b><span>Atraso somado</span></div>
    </div>
    <div class="card wrap">
      <table>
        <thead><tr><th>Estagiário</th><th>Dias com entrada</th><th>Dias com atraso</th><th>Atraso total</th><th>Horas trabalhadas</th><th>Sem saída</th><th>Status</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <div class="card wrap">
      <h2>Registros individuais</h2>
      <table>
        <thead><tr><th>Data</th><th>Hora</th><th>Estagiário</th><th>Tipo</th></tr></thead>
        <tbody>${recs
          .filter(r => noPeriodo(String(r.data).slice(0,10)))
          .slice()
          .sort((a,b) => (String(b.data)+String(b.hora)).localeCompare(String(a.data)+String(a.hora)))
          .map(r => `<tr><td>${br(r.data)}</td><td>${esc(String(r.hora).slice(0,5))}</td><td>${esc(r.nome)}</td><td>${esc(r.tipo)}</td></tr>`)
          .join("") || '<tr><td colspan="4">Nenhum registro neste período.</td></tr>'}</tbody>
      </table>
    </div>`;
}

function exportarCSV() {
  if (!S || S.role !== "supervisor") return;

  const linhas = [
    ["Data", "Hora", "Estagiário", "Tipo"],
    ...recs
      .filter(r => noPeriodo(String(r.data).slice(0,10)))
      .map(r => [r.data, String(r.hora).slice(0,5), r.nome, r.tipo])
  ];
  const csv = "\uFEFF" + linhas.map(linha =>
    linha.map(v => '"' + String(v ?? "").replace(/"/g, '""') + '"').join(";")
  ).join("\r\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "folha_de_ponto.csv";
  link.click();
  URL.revokeObjectURL(link.href);
}
</script>
</body>
</html>

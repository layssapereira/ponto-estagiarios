<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folha de Ponto – Estagiários</title>

  <style>
    :root {
      --bg: #f5f6f8;
      --card: #fff;
      --tx: #1c2630;
      --mut: #66727f;
      --bd: #dfe3e8;
      --ac: #2563eb;
      --bad: #c62828;
      --ok: #2e7d32;
      --warn: #b26a00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.45 system-ui, -apple-system, sans-serif;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 17px; margin-top: 0; }

    .sub {
      color: var(--mut);
      margin: 2px 0 14px;
      font-size: 13px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }

    label {
      display: flex;
      flex-direction: column;
      font-size: 12px;
      color: var(--mut);
      gap: 3px;
      flex: 1;
      min-width: 140px;
    }

    input, select {
      font: inherit;
      color: var(--tx);
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 9px;
      width: 100%;
      margin-top: 3px;
    }

    button {
      font: inherit;
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      background: var(--ac);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      margin-top: 8px;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    button.s {
      background: var(--bg);
      color: var(--tx);
      border: 1px solid var(--bd);
    }

    .wrap { overflow-x: auto; }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }

    th, td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--bd);
      text-align: left;
      white-space: nowrap;
    }

    th {
      font-size: 12px;
      color: var(--mut);
      font-weight: 600;
    }

    .late, .bad {
      color: var(--bad);
      font-weight: 600;
    }

    .ok { color: var(--ok); }
    .warn { color: var(--warn); }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .kpi b {
      display: block;
      font-size: 22px;
    }

    .kpi span {
      font-size: 12px;
      color: var(--mut);
    }

    .chip {
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 12px;
      border: 1px solid currentColor;
    }

    .note {
      font-size: 12px;
      color: var(--mut);
    }

    .msg {
      margin: 10px 0 0;
      font-weight: 600;
    }

    .periodo {
      font-weight: 600;
      color: var(--ac);
      margin: 0 0 12px;
    }

    details summary { cursor: pointer; }

    #login {
      max-width: 380px;
      margin: 40px auto;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .alerta {
      background: #fff4e5;
      border: 1px solid #f0c987;
      border-radius: 8px;
      padding: 10px;
      margin: 8px 0;
    }

    .alerta-falta {
      background: #fff0f0;
      border-color: #e7b2b2;
    }
  </style>
</head>

<body>
<main>

  <div id="login" class="card">
    <h1>Folha de Ponto</h1>
    <p class="sub">Entre com seu nome e sua senha.</p>

    <div style="display:flex;flex-direction:column;gap:10px">
      <label>Nome completo
        <input id="ln" type="text" placeholder="Digite seu nome" autocomplete="username">
      </label>

      <label>Senha
        <input id="ls" type="password" placeholder="Digite sua senha" autocomplete="current-password">
      </label>

      <button type="button" id="lb">Entrar</button>
    </div>

    <p id="lm" class="msg bad"></p>

    <p class="note" style="margin-top:12px">
      Supervisora: <b>Layssa</b><br>
      Estagiários: Lucas, Maria Js, Caua, Felipe, Isa, Ana,
      Jullya, Yaskara, Caio, Pina, Camilli, Juan e Enzo.
    </p>
  </div>

  <div id="app" style="display:none">
    <div class="top">
      <div>
        <h1 id="who"></h1>
        <p class="sub" id="role"></p>
      </div>
      <button class="s" onclick="sair()">Sair</button>
    </div>

    <div id="body"></div>
  </div>

<script>
"use strict";

/* CONFIGURAÇÃO DO SUPABASE */
const SUPABASE_URL = "https://nrcpqtrmfxxnemgnfzqz.supabase.co";
const SUPABASE_KEY = "sb_publishable_6uKw8SGTytkd4w9Q6Cnvcg_KF8tAymw";

/* LISTA DE ESTAGIÁRIOS */
const users = [
  { nome: "Lucas", role: "estagiario" },
  { nome: "Maria Js", role: "estagiario" },
  { nome: "Caua", role: "estagiario" },
  { nome: "Felipe", role: "estagiario" },
  { nome: "Isa", role: "estagiario" },
  { nome: "Ana", role: "estagiario" },
  { nome: "Jullya", role: "estagiario" },
  { nome: "Yaskara", role: "estagiario" },
  { nome: "Caio (Treinamento)", role: "estagiario" },
  { nome: "Pina", role: "estagiario" },
  { nome: "Camilli", role: "estagiario" },
  { nome: "Juan", role: "estagiario" },
  { nome: "Enzo", role: "estagiario" }
];

/* CONFIGURAÇÕES E REGISTROS LOCAIS */
let cfg = JSON.parse(
  localStorage.getItem("ponto_cfg") ||
  JSON.stringify({
    entrada: "08:00",
    tol: 10,
    limite: 60
  })
);

let recs = [];
let S = { nome: "", role: "" };
let msg = "";

const \$ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

const mins = t => {
  if (!t) return null;
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
};

const hm = m => m == null ? "—" : Math.floor(m / 60) + "h" + pad(m % 60);
const tm = m => m == null ? "—" : pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const br = d => d.split("-").reverse().join("/");

function saveDB() {
  localStorage.setItem("ponto_cfg", JSON.stringify(cfg));
}

/* CARREGAR REGISTROS DO SUPABASE */
async function carregarRegistrosSupabase() {
  try {
    const resposta = await fetch(
      SUPABASE_URL + "/functions/v1/pontos-estagiarios?action=listar",
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );
    if (resposta.ok) {
      const dados = await resposta.json();
      if (dados.recs) recs = dados.recs;
    }
  } catch (e) {
    console.error("Erro ao buscar registros do servidor:", e);
  }
}

/* PERÍODO DO DIA 20 AO DIA 19 (COM TRAVA PARA 20/10) */
function periodoAtual() {
  const hoje = new Date();
  hoje.setHours(12, 0, 0, 0);

  let inicio, fim;

  // Trava temporária para iniciar a partir de 20/10/2026
  const dataLimiteInicio = new Date(2026, 9, 20, 12, 0, 0);
  if (hoje < dataLimiteInicio) {
    inicio = new Date(2026, 9, 20, 12, 0, 0);
    fim = new Date(2026, 10, 19, 12, 0, 0);
    return { inicio, fim };
  }

  // A partir de 20/10/2026, atualiza automaticamente pelos próximos períodos
  if (hoje.getDate() >= 20) {
    inicio = new Date(
      hoje.getFullYear(), hoje.getMonth(), 20, 12
    );
    fim = new Date(
      hoje.getFullYear(), hoje.getMonth() + 1, 19, 12
    );
  } else {
    inicio = new Date(
      hoje.getFullYear(), hoje.getMonth() - 1, 20, 12
    );
    fim = new Date(
      hoje.getFullYear(), hoje.getMonth(), 19, 12
    );
  }

  return { inicio, fim };
}

function textoPeriodo() {
  const p = periodoAtual();
  return "Período: " + br(iso(p.inicio)) + " até " + br(iso(p.fim));
}

function dentroPeriodo(data) {
  const p = periodoAtual();
  return data >= iso(p.inicio) && data <= iso(p.fim);
}

/* LOGIN PELO SUPABASE */
async function fazerLogin() {
  const nomeIn = \$("#ln").value.trim();
  const senhaIn = \$("#ls").value.trim();
  const mensagem = \$("#lm");

  if (!nomeIn || !senhaIn) {
    mensagem.textContent = "Informe seu nome e sua senha.";
    return;
  }

  mensagem.textContent = "Verificando login...";
  \$("#lb").disabled = true;

  try {
    const resposta = await fetch(
      SUPABASE_URL + "/functions/v1/login-estagiarios",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        },
        body: JSON.stringify({ nome: nomeIn, senha: senhaIn })
      }
    );

    const dados = await resposta.json();

    if (!resposta.ok || !dados.sucesso || !dados.funcionario) {
      mensagem.textContent = dados.erro || "Nome ou senha incorretos.";
      return;
    }

    S = {
      nome: dados.funcionario.nome,
      role: dados.funcionario.perfil
    };

    if (!["supervisor", "estagiario"].includes(S.role)) {
      S = { nome: "", role: "" };
      mensagem.textContent = "Perfil de acesso inválido.";
      return;
    }

    \$("#login").style.display = "none";
    \$("#app").style.display = "";
    \$("#who").textContent = S.nome;
    \$("#role").textContent = S.role === "supervisor" ? "Painel da Supervisora" : "Meu Ponto";

    msg = "";
    mensagem.textContent = "";
    
    await carregarRegistrosSupabase();
    load();

  } catch (erro) {
    mensagem.textContent = "Não foi possível conectar. Verifique a internet e tente novamente.";
    console.error(erro);
  } finally {
    \$("#lb").disabled = false;
  }
}

function sair() {
  S = { nome: "", role: "" };
  \$("#ls").value = "";
  \$("#app").style.display = "none";
  \$("#login").style.display = "";
  \$("#lm").textContent = "";
}

\$("#lb").onclick = fazerLogin;
\$("#ls").onkeydown = e => { if (e.key === "Enter") fazerLogin(); };

/* ORGANIZA OS REGISTROS POR ESTAGIÁRIO E DIA */
function dayMap(list) {
  const m = {};
  list.forEach(r => {
    const k = r.nome + "|" + r.data;
    const d = m[k] = m[k] || { nome: r.nome, data: r.data, ent: null, sai: null };
    const t = mins(r.hora);
    if (t == null) return;

    if (r.tipo === "Entrada") {
      if (d.ent == null || t < d.ent) d.ent = t;
    }
    if (r.tipo === "Saída") {
      if (d.sai == null || t > d.sai) d.sai = t;
    }
  });

  Object.values(m).forEach(d => {
    const atraso = d.ent == null ? 0 : d.ent - mins(cfg.entrada);
    d.atraso = atraso > cfg.tol ? atraso : 0;
    d.trab = d.ent != null && d.sai != null && d.sai >= d.ent ? d.sai - d.ent : null;
  });
  return m;
}

/* DIAS DE SEGUNDA A SEXTA */
function weekdays() {
  const p = periodoAtual();
  const dias = [];
  const d = new Date(p.inicio);

  while (d <= p.fim) {
    if (d.getDay() !== 0 && d.getDay() !== 6) {
      dias.push(iso(d));
    }
    d.setDate(d.getDate() + 1);
  }
  return dias;
}

function load() {
  if (S.role === "supervisor") {
    viewSup();
  } else if (S.role === "estagiario") {
    viewMine();
  }
}

/* TELA DO ESTAGIÁRIO */
function viewMine() {
  const registros = recs.filter(r => r.nome === S.nome && dentroPeriodo(r.data));
  const dm = dayMap(registros);
  const ds = weekdays();

  let tA = 0, nA = 0, tT = 0;

  const rows = ds.map(dia => {
    const x = dm[S.nome + "|" + dia] || {};
    const ent = x.ent ?? null;
    const sai = x.sai ?? null;

    if (x.atraso) { tA += x.atraso; nA++; }
    tT += x.trab || 0;

    return `
      <tr>
        <td>${br(dia)}</td>
        <td>${tm(ent)}</td>
        <td>${tm(sai)}</td>
        <td class="${x.atraso ? "late" : ""}">
          ${ent == null ? "—" : x.atraso ? x.atraso + " min" : "No horário"}
        </td>
        <td>${hm(x.trab)}</td>
      </tr>
    `;
  }).join("");

  \$("#body").innerHTML = `
    <p class="periodo">${textoPeriodo()}</p>
    <div class="card">
      <h2>Registrar ponto</h2>
      <p>Use os botões para registrar seu horário atual.</p>
      <div class="actions">
        <button type="button" onclick="registraPonto('Entrada')">Registrar entrada</button>
        <button type="button" onclick="registraPonto('Saída')">Registrar saída</button>
      </div>
      <p class="msg">${esc(msg)}</p>
    </div>
    <div class="kpis">
      <div class="kpi"><b>${hm(tA)}</b><span>Atraso total</span></div>
      <div class="kpi"><b>${nA}</b><span>Dias com atraso</span></div>
      <div class="kpi"><b>${hm(tT)}</b><span>Horas trabalhadas</span></div>
    </div>
    <div class="card wrap">
      <h2>Meu histórico</h2>
      <table>
        <tr><th>Data</th><th>Entrada</th><th>Saída</th><th>Atraso</th><th>Horas</th></tr>
        ${rows}
      </table>
    </div>
  `;
}

/* REGISTRAR ENTRADA OU SAÍDA */
async function registraPonto(tipo) {
  if (S.role !== "estagiario") return;

  const agora = new Date();
  const data = iso(agora);
  const hora = pad(agora.getHours()) + ":" + pad(agora.getMinutes());

  if (!dentroPeriodo(data)) {
    msg = "A data atual está fora do período de apuração.";
    load();
    return;
  }

  msg = "Salvando ponto no servidor...";
  load();

  try {
    const resposta = await fetch(
      SUPABASE_URL + "/functions/v1/pontos-estagiarios",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        },
        body: JSON.stringify({
          action: "registrar",
          nome: S.nome,
          senha: \$("#ls").value,
          tipo,
          data,
          hora
        })
      }
    );

    const resultado = await resposta.json();
    if (!resposta.ok || !resultado.sucesso) {
      msg = resultado.erro || "Não foi possível salvar o ponto.";
      load();
      return;
    }

    msg = tipo + " salva no banco de dados às " + hora + ".";
    await carregarRegistrosSupabase();
    load();

  } catch (erro) {
    console.error(erro);
    msg = "Erro de conexão. O ponto não foi confirmado pelo servidor.";
    load();
  }
}

/* SITUAÇÃO DO PONTO PARA AVISOS */
function statusPontoDia(d, data, hoje) {
  const ent = d ? d.ent : null;
  const sai = d ? d.sai : null;
  const atraso = d ? (d.atraso || 0) : 0;

  if (ent == null && sai == null) {
    return data === hoje ? "Pendente hoje — nenhum ponto registrado" : "Falta do dia — sem registro";
  }
  if (ent == null) return "Falta de entrada";
  if (sai == null) return data === hoje ? "Saída pendente hoje" : "Falta de saída";
  if (atraso > 0) return "Atraso de " + atraso + " minutos";
  return "Completo";
}

/* CARREGAR OS HORÁRIOS PARA EDITAR (SUPERVISORA) */
function carregarEdicao() {
  if (S.role !== "supervisor") return;

  const nomeEl = \$("#editNome");
  const dataEl = \$("#editData");
  if (!nomeEl || !dataEl) return;

  const nome = nomeEl.value;
  const data = dataEl.value;
  if (!nome || !data) return;

  const doDia = recs.filter(r => r.nome === nome && r.data === data);
  const entradas = doDia.filter(r => r.tipo === "Entrada").map(r => mins(r.hora)).filter(v => v != null);
  const saidas = doDia.filter(r => r.tipo === "Saída").map(r => mins(r.hora)).filter(v => v != null);

  const entrada = entradas.length ? Math.min(...entradas) : null;
  const saida = saidas.length ? Math.max(...saidas) : null;

  \$("#editEntrada").value = entrada == null ? "" : tm(entrada);
  \$("#editSaida").value = saida == null ? "" : tm(saida);

  \$("#editMsg").textContent = doDia.length
    ? "Horários carregados. Altere o necessário e salve."
    : "Não há ponto nesta data. Você pode inserir os horários.";
}

/* SALVAR EDIÇÃO DO PONTO (SUPABASE OU LOCAL) */
async function editarPonto() {
  if (S.role !== "supervisor") return;

  const nome = \$("#editNome").value;
  const data = \$("#editData").value;
  const entrada = \$("#editEntrada").value;
  const saida = \$("#editSaida").value;
  const mensagem = \$("#editMsg");

  if (!nome || !data) {
    mensagem.textContent = "Selecione o estagiário e a data.";
    return;
  }

  if (!dentroPeriodo(data)) {
    mensagem.textContent = "A data precisa estar no período atual.";
    return;
  }

  if (!entrada && !saida) {
    if (!confirm("Os dois horários estão vazios. Deseja remover os registros deste dia?")) return;
  }

  if (entrada && saida && mins(saida) < mins(entrada)) {
    mensagem.textContent = "A saída não pode ser anterior à entrada.";
    return;
  }

  mensagem.textContent = "Salvando alterações...";

  try {
    const resposta = await fetch(
      SUPABASE_URL + "/functions/v1/pontos-estagiarios",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        },
        body: JSON.stringify({
          action: "editar_supervisor",
          supervisor: S.nome,
          senha_supervisor: \$("#ls").value,
          nome_estagiario: nome,
          data,
          entrada,
          saida
        })
      }
    );

    const resultado = await resposta.json();
    if (!resposta.ok) {
      mensagem.textContent = resultado.erro || "Erro ao salvar alteração.";
      return;
    }

    await carregarRegistrosSupabase();
    viewSup();

    \$("#editNome").value = nome;
    \$("#editData").value = data;
    carregarEdicao();
    \$("#editMsg").textContent = "Alterações salvas com sucesso.";

  } catch (e) {
    console.error(e);
    mensagem.textContent = "Erro de conexão ao salvar.";
  }
}

/* EXPORTAR RELATÓRIO EM CSV PARA O EXCEL */
function exportarRelatorioAtrasos() {
  if (S.role !== "supervisor") return;

  const p = periodoAtual();
  const inicio = iso(p.inicio);
  const fim = iso(p.fim);
  const hoje = iso(new Date());
  const limite = hoje < fim ? hoje : fim;

  const dias = weekdays().filter(d => d >= inicio && d <= limite);
  const dm = dayMap(recs.filter(r => r.data >= inicio && r.data <= fim));

  const detalhes = [];
  const resumo = [];

  users.forEach(u => {
    let diasSemPonto = 0, faltasEntrada = 0, faltasSaida = 0;
    let diasAtraso = 0, totalAtraso = 0, pendenciasHoje = 0;

    dias.forEach(data => {
      const d = dm[u.nome + "|" + data] || { nome: u.nome, data, ent: null, sai: null, atraso: 0 };
      const status = statusPontoDia(d, data, hoje);
      const atraso = d.atraso || 0;

      if (data === hoje && (d.ent == null || d.sai == null)) {
        pendenciasHoje++;
      } else if (data < hoje) {
        if (d.ent == null && d.sai == null) diasSemPonto++;
        else if (d.ent == null) faltasEntrada++;
        else if (d.sai == null) faltasSaida++;
      }

      if (atraso > 0) {
        diasAtraso++;
        totalAtraso += atraso;
      }

      if (status !== "Completo") {
        detalhes.push([u.nome, br(data), tm(d.ent), tm(d.sai), status, atraso]);
      }
    });

    resumo.push([u.nome, diasSemPonto, faltasEntrada, faltasSaida, pendenciasHoje, diasAtraso, totalAtraso, hm(totalAtraso)]);
  });

  const linhas = [
    ["RELATÓRIO DE PONTO — FALTAS DE REGISTRO E ATRASOS"],
    ["Período", br(inicio) + " até " + br(fim)],
    [],
    ["DETALHAMENTO POR DIA"],
    ["Estagiário", "Data", "Entrada", "Saída", "Ocorrência", "Atraso (minutos)"],
    ...detalhes,
    [],
    ["RESUMO POR ESTAGIÁRIO"],
    ["Estagiário", "Dias sem ponto", "Faltas de entrada", "Faltas de saída", "Pendências hoje", "Dias com atraso", "Atraso total (min)", "Atraso total"],
    ...resumo
  ];

  const csv = "\uFEFF" + linhas.map(l => l.map(v => '"' + String(v ?? "").replace(/"/g, '""') + '"').join(";")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = `relatorio_ponto_${inicio}_a_${fim}.csv`;
  document.body.appendChild(link);
  link.click();
  link.remove();
}

/* PAINEL DA SUPERVISORA */
function viewSup() {
  if (S.role !== "supervisor") return;

  const p = periodoAtual();
  const inicio = iso(p.inicio);
  const fim = iso(p.fim);
  const hoje = iso(new Date());
  const limite = hoje < fim ? hoje : fim;

  const registros = recs.filter(r => r.data >= inicio && r.data <= fim);
  const dm = dayMap(registros);
  const dias = weekdays().filter(d => d >= inicio && d <= limite);

  const g = {};
  users.forEach(u => {
    g[u.nome] = { nome: u.nome, dias: 0, nA: 0, tA: 0, tT: 0, sem: 0, lista: [] };
  });

  Object.values(dm).forEach(d => {
    const s = g[d.nome] = g[d.nome] || { nome: d.nome, dias: 0, nA: 0, tA: 0, tT: 0, sem: 0, lista: [] };
    if (d.ent == null) return;
    s.dias++;
    s.tT += d.trab || 0;
    if (d.trab == null) s.sem++;

    if (d.atraso > 0) {
      s.nA++;
      s.tA += d.atraso;
      s.lista.push(br(d.data) + " – entrada " + tm(d.ent) + " (" + d.atraso + " min)");
    }
  });

  const L = Object.values(g).sort((a, b) => b.tA - a.tA);
  const totalAtrasos = L.reduce((t, s) => t + s.tA, 0);

  const linhas = L.map(s => {
    const status = s.tA > cfg.limite ? ["Crítico", "bad"] : s.tA > 0 ? ["Atenção", "warn"] : ["Em dia", "ok"];
    return `
      <tr>
        <td>
          <details>
            <summary>${esc(s.nome)}</summary>
            <div class="note">${s.lista.length ? s.lista.map(esc).join("<br>") : "Nenhum atraso."}</div>
          </details>
        </td>
        <td>${s.dias}</td>
        <td>${s.nA}</td>
        <td class="${s.tA ? "late" : ""}">${hm(s.tA)}</td>
        <td>${hm(s.tT)}</td>
        <td>${s.sem || "—"}</td>
        <td><span class="chip ${status[1]}">${status[0]}</span></td>
      </tr>
    `;
  }).join("");

  const opcoes = users.map(u => `<option value="${esc(u.nome)}">${esc(u.nome)}</option>`).join("");
  const dataHoje = iso(new Date());
  const dataInicial = dataHoje < inicio ? inicio : dataHoje > fim ? fim : dataHoje;

  const avisos = [];
  users.forEach(u => {
    dias.forEach(data => {
      const d = dm[u.nome + "|" + data] || { ent: null, sai: null, atraso: 0 };
      const status = statusPontoDia(d, data, hoje);
      if (status !== "Completo") {
        avisos.push({ nome: u.nome, data, entrada: d.ent, saida: d.sai, atraso: d.atraso || 0, status });
      }
    });
  });

  const avisosHtml = avisos.length ? `
    <div class="wrap">
      <table>
        <tr><th>Estagiário</th><th>Data</th><th>Entrada</th><th>Saída</th><th>Ocorrência</th></tr>
        ${avisos.map(a => `
          <tr>
            <td>\${esc(a.nome)}</td>
            <td>\${br(a.data)}</td>
            <td>\${tm(a.entrada)}</td>
            <td>\${tm(a.saida)}</td>
            <td class="${a.atraso > 0 \vert{}\vert{} a.status.includes("Falta") ? "late" : "warn"}">${esc(a.status)}</td>
          </tr>
        `).join("")}
      </table>
    </div>
  ` : `<p class="ok">Nenhuma pendência encontrada nos dias analisados.</p>`;

  \$("#body").innerHTML = `
    <p class="periodo">${textoPeriodo()}</p>

    <div class="card">
      <h2>⚠️ Avisos de ponto</h2>
      <p class="note">Confira os dias úteis atuais e anteriores do período.</p>
      <p><b>${avisos.length}</b> ocorrência(s) para conferir.</p>
      ${avisosHtml}
    </div>

    <div class="card">
      <h2>Editar ponto do estagiário</h2>
      <div class="row">
        <label>Estagiário
          <select id="editNome" onchange="carregarEdicao()">${opcoes}</select>
        </label>
        <label>Data do ponto
          <input id="editData" type="date" min="${inicio}" max="${fim}" value="${dataInicial}" onchange="carregarEdicao()">
        </label>
      </div>

      <div class="row" style="margin-top:10px">
        <label>Horário de entrada <input id="editEntrada" type="time"></label>
        <label>Horário de saída <input id="editSaida" type="time"></label>
      </div>

      <div class="actions" style="margin-top:10px">
        <button type="button" class="s" onclick="carregarEdicao()">Carregar horários</button>
        <button type="button" onclick="editarPonto()">Salvar alterações</button>
      </div>
      <p id="editMsg" class="msg" aria-live="polite"></p>
    </div>

    <div class="card">
      <h2>Relatório de ponto</h2>
      <p>Gere a planilha detalhada com todos os dados do período.</p>
      <button type="button" onclick="exportarRelatorioAtrasos()">Gerar relatório de ponto (Excel)</button>
    </div>

    <div class="kpis">
      <div class="kpi"><b>${L.length}</b><span>Estagiários</span></div>
      <div class="kpi"><b>${L.filter(s => s.tA > 0).length}</b><span>Com atraso</span></div>
      <div class="kpi"><b>${hm(totalAtrasos)}</b><span>Atraso somado</span></div>
      <div class="kpi"><b>${avisos.length}</b><span>Ocorrências</span></div>
    </div>

    <div class="card wrap">
      <h2>Resumo dos estagiários</h2>
      <table>
        <tr>
          <th>Estagiário</th><th>Dias com entrada</th><th>Dias c/ atraso</th>
          <th>Atraso total</th><th>Horas trabalhadas</th><th>Sem saída</th><th>Status</th>
        </tr>
        ${linhas}
      </table>
    </div>
  `;

  carregarEdicao();
}
</script>
</main>
